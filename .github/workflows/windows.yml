name: windows

# Builds the Windows executable on a real Windows runner and attaches a
# portable zip to the run. Cross-compiling from Linux was avoided deliberately:
# nothing in the dependency tree compiles C, but rustc has a known crash
# cross-compiling egui to the windows-gnu target, and a native MSVC build is
# the thing we actually want to ship anyway.

on:
  push:
    branches: [master]
    # A version tag (v0.2.0) also publishes the build to a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# contents: write lets the tag build publish a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The GPU tests ask wgpu for an adapter and skip themselves when there is
      # none, so this is safe on a runner without a real GPU (DX12's WARP
      # software adapter often lets them run for real).
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/raw-editor.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath raw-editor-windows-x86_64.zip

      # archive: false uploads the zip as-is. The default wraps it in a
      # second zip, so the download used to be a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: raw-editor-windows-x86_64.zip
          archive: false
          if-no-files-found: error

      # Both platform workflows attach to the same release, so whichever
      # finishes first creates it and the other one just uploads.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "raw-editor $TAG" --generate-notes \
            || true
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" "raw-editor-windows-x86_64.zip" --clobber && exit 0
            sleep 5
          done
          exit 1

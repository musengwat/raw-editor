name: windows

# Builds the Windows executable on a real Windows runner and attaches a
# portable zip to the run. Cross-compiling from Linux was avoided deliberately:
# nothing in the dependency tree compiles C, but rustc has a known crash
# cross-compiling egui to the windows-gnu target, and a native MSVC build is
# the thing we actually want to ship anyway.

on:
  push:
    branches: [master]
    # A version tag (v0.2.0) publishes to that tag's Release; a push to
    # master publishes a build-* Release (see packaging/publish-release.sh).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# contents: write lets master and tag builds publish a GitHub Release;
# actions: write lets a run delete the artifacts older runs left behind.
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The GPU tests ask wgpu for an adapter and skip themselves when there is
      # none, so this is safe on a runner without a real GPU (DX12's WARP
      # software adapter often lets them run for real).
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/raw-editor.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath raw-editor-windows-x86_64.zip

      # archive: false uploads the zip as-is. The default wraps it in a
      # second zip, so the download used to be a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: raw-editor-windows-x86_64.zip
          archive: false
          if-no-files-found: error

      # Keep only the newest build: delete copies of this artifact uploaded by
      # earlier runs, so old zips don't sit in Actions storage for 90 days.
      # Run IDs only increase, so a slow older run never deletes a newer zip.
      - name: Delete older artifacts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: raw-editor-windows-x86_64.zip
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            -q ".artifacts[] | select(.workflow_run.id < $GITHUB_RUN_ID) | .id")
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done

      # Every master push and v* tag publishes to a Release; PRs and manual
      # runs only upload the artifact above.
      - name: Publish to release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/publish-release.sh "raw-editor-windows-x86_64.zip"

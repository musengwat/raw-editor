[package]
name = "raw-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
eframe = { version = "0.36.1", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
rawler = "0.7.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "raw-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
dirs = "6.0.0"
eframe = { version = "0.36.1", features = ["wgpu"] }
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
little_exif = "0.6.23"
pollster = "1.0.1"
rawler = "0.7.2"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["multipart"] }

[dev-dependencies]
little_exif = "0.6.23"
